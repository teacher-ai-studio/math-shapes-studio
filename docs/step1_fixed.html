(()=>{'use strict';
const $=s=>document.querySelector(s);const names={circle:'まる',triangle:'さんかく',square:'しかく'};const audios=Object.fromEntries(Object.entries(SOUNDS).map(([k,v])=>[k,new Audio(v)]));Object.values(audios).forEach(a=>a.preload='auto');
let type='circle',goal=5,hit=0,shrink=true,muted=false,token=0,frame=0,delays=[],lastTime=0;
function svg(k){return '<svg viewBox="0 0 100 100" aria-hidden="true">'+(k==='circle'?'<circle cx="50" cy="50" r="43" fill="#ed4949"/>':k==='triangle'?'<polygon points="50,6 96,92 4,92" fill="#e9bd25"/>':'<rect x="7" y="7" width="86" height="86" fill="#328bd7"/>')+'</svg>'}
function playSound(k){if(muted)return;Object.entries(audios).forEach(([key,a])=>{if(key!==k){a.pause();a.currentTime=0}});const a=audios[k];a.pause();a.currentTime=0;a.play().catch(()=>{});}
function clearWork(){token++;cancelAnimationFrame(frame);for(const id of delays)clearTimeout(id);delays=[];for(const a of Object.values(audios)){a.pause();a.currentTime=0}}
function later(f,ms){delays.push(setTimeout(f,ms))}
function show(id){for(const p of ['start','play','complete'])$('#'+p).classList.toggle('hide',p!==id);$('#home').classList.toggle('hide',id==='start')}
for(const b of document.querySelectorAll('[data-shape]')){let t=b.dataset.shape;b.innerHTML=svg(t)+'<span>'+names[t]+'</span>';b.addEventListener('click',()=>launch(t))}
$('#sizeMode').onclick=()=>{shrink=!shrink;$('#sizeMode').textContent='だんだん ちいさく：'+(shrink?'オン':'オフ');$('#sizeMode').setAttribute('aria-pressed',String(shrink))};
$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent='おと：'+(muted?'オフ':'オン');$('#mute').setAttribute('aria-pressed',String(muted));if(muted)for(const a of Object.values(audios))a.pause()};
function launch(t){clearWork();type=t;goal=Number($('#goal').value);hit=0;$('#target').textContent=names[type]+'に タッチ！';show('play');spawn()}
function spawn(){let id=token,board=$('#board');board.replaceChildren();$('#remaining').textContent='あと '+(goal-hit)+' かい';
const W=board.clientWidth,H=board.clientHeight;const phase=goal===1?0:hit/(goal-1);const ratio=shrink?(0.88-0.50*phase):0.88;const extent=Math.min(W*.77,H*.86,410);const size=Math.max(65,Math.min(extent*ratio, W*.9,H*.9));
let minX=size/2+9,maxX=W-size/2-9,minY=size/2+9,maxY=H-size/2-9;
if(maxX<minX){minX=maxX=W/2}if(maxY<minY){minY=maxY=H/2}
// 初回は中央付近をゆっくり動き、タッチごとに移動可能範囲を広げる。
const range=0.12+0.88*phase;const centerX=W/2,centerY=H/2;
const clamp=(v,a,b)=>Math.max(a,Math.min(v,b));
const lowX=clamp(centerX-(maxX-minX)*range/2,minX,maxX),highX=clamp(centerX+(maxX-minX)*range/2,minX,maxX);
const lowY=clamp(centerY-(maxY-minY)*range/2,minY,maxY),highY=clamp(centerY+(maxY-minY)*range/2,minY,maxY);
let x=(lowX+highX)/2,y=(lowY+highY)/2,dx=x,dy=y,locked=false;
let b=document.createElement('button');b.className='moving';b.type='button';b.style.width=size+'px';b.style.height=size+'px';b.setAttribute('aria-label',names[type]+'にタッチ');b.innerHTML=svg(type);board.append(b);
function destination(){dx=lowX+Math.random()*(highX-lowX);dy=lowY+Math.random()*(highY-lowY)}destination();
function animate(t){if(id!==token||locked)return;let dt=lastTime?Math.min((t-lastTime)/1000,.055):.016;lastTime=t;let vx=dx-x,vy=dy-y,d=Math.hypot(vx,vy);if(d<4)destination();else{const step=Math.min(d,Math.max(8,Math.min(W,H)*.07)*dt);x+=vx/d*step;y+=vy/d*step}b.style.left=x+'px';b.style.top=y+'px';frame=requestAnimationFrame(animate)}lastTime=0;frame=requestAnimationFrame(animate);
b.onclick=()=>{if(locked)return;locked=true;cancelAnimationFrame(frame);hit++;$('#remaining').textContent='あと '+(goal-hit)+' かい';b.classList.add('pulse');const message=document.createElement('div');message.className='voice';message.textContent=names[type]+'！';board.append(message);playSound(type);
later(()=>{if(id!==token)return;b.classList.add('fade');later(()=>{if(id!==token)return;if(hit>=goal){board.replaceChildren();show('complete');playSound('finish')}else spawn()},330)},1100)};
}
$('#home').onclick=()=>{clearWork();show('start')};$('#retry').onclick=()=>launch(type);$('#again').onclick=()=>launch(type);$('#back').onclick=()=>{clearWork();show('start')};
})();
</script></body></html>
