<style>

.hero{text-align:center;padding:9px}.hero h2{font-size:clamp(32px,5vw,58px);margin:4px 0 10px;font-weight:950}.hero p{font-size:clamp(19px,2.5vw,29px);font-weight:800;margin:0}.figures{display:flex;align-items:center;justify-content:center;gap:clamp(12px,4vw,54px);padding:12px}.figures svg{width:clamp(65px,11vw,120px);height:clamp(65px,11vw,120px)}

Object.entries(embeddedSounds).forEach(([kind,src])=>{audio[kind]=new Audio(src);audio[kind].preload='auto';});
function fig(t){return `<svg viewBox="0 0 100 100" aria-hidden="true">${t==='circle'?'<circle cx="50" cy="50" r="43" fill="#e84b4b"/>':t==='triangle'?'<polygon points="50,6 96,91 4,91" fill="#ebc329"/>':'<rect x="8" y="8" width="84" height="84" fill="#378bd8"/>'}</svg>`}
function show(id){['intro','settings','play','complete'].forEach(k=>$(k).classList.toggle('hidden',k!==id));$('home').classList.toggle('hidden',id==='intro')}
function timer(fn,ms){let t=setTimeout(fn,ms);active.push(t)}function stop(){round++;active.forEach(clearTimeout);active=[];Object.values(audio).forEach(a=>{a.pause();a.currentTime=0})}
function fallback(which){try{let C=window.AudioContext||window.webkitAudioContext;if(!C)return;ctx??=new C();ctx.resume();let now=ctx.currentTime,notes=which==='correct'?[650,870]:which==='wrong'?[260,230]:[523,659,784,1047];notes.forEach((hz,i)=>{let start=now+i*(which==='finish'?.14:.13),o=ctx.createOscillator(),g=ctx.createGain();o.type=which==='wrong'?'triangle':'sine';o.frequency.value=hz;g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(.13,start+.018);g.gain.exponentialRampToValueAtTime(.0001,start+.16);o.connect(g);g.connect(ctx.destination);o.start(start);o.stop(start+.18)})}catch(e){}}
function sound(which){if(muted)return;let a=audio[which];if(a){try{a.pause();a.currentTime=0;const p=a.play();if(p)p.catch(()=>fallback(which));}catch(e){fallback(which)}}else fallback(which)}
$('herofigures').innerHTML=types.map(fig).join('');types.forEach(t=>{let b=document.createElement('button');b.className='choice'+(t===chosen?' selected':'');b.dataset.type=t;b.innerHTML=fig(t)+`<span>${labels[t]}</span>`;b.onclick=()=>{chosen=t;document.querySelectorAll('.choice').forEach(x=>x.classList.toggle('selected',x.dataset.type===t))};$('choices').append(b)});
[6,9,12,15].forEach(n=>{let b=document.createElement('button');b.className='countpick'+(n===amount?' selected':'');b.innerHTML=`${n}<small>こ</small>`;b.onclick=()=>{amount=n;document.querySelectorAll('.countpick').forEach(x=>x.classList.toggle('selected',x===b))};$('counts').append(b)});
function shuffle(items){for(let i=items.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[items[i],items[j]]=[items[j],items[i]]}return items}
function update(){ $('remaining').textContent='あと '+left+' こ'}
function start(){stop();show('play');$('goal').innerHTML=fig(chosen)+`<span>${labels[chosen]}を さがそう！</span>`;let board=$('board');board.replaceChildren();let r=round;left=amount/3;update();let cols=amount===15?5:amount===12?4:3,rows=Math.ceil(amount/cols),w=board.clientWidth/cols,h=board.clientHeight/rows;
let kinds=[];types.forEach(t=>{for(let i=0;i<amount/3;i++)kinds.push(t)});shuffle(kinds);
kinds.forEach((t,i)=>{let col=i%cols,row=Math.floor(i/cols),cell=Math.min(w,h);let s=cell*(amount===6?.85:amount===9?.80:amount===12?.77:.75)*(i%3===0?1:i%3===1?.84:.94);s=Math.max(40,s);s=Math.min(s,w*.92,h*.91);let x=(col+.5)*w+(Math.random()-.5)*Math.max(0,w-s)*.48,y=(row+.5)*h+(Math.random()-.5)*Math.max(0,h-s)*.48;let b=document.createElement('button');b.className='piece';b.style.cssText=`left:${x}px;top:${y}px;width:${s}px;height:${s}px`;b.innerHTML=fig(t);b.setAttribute('aria-label',labels[t]);board.append(b);let locked=false;b.onclick=()=>{if(locked||r!==round)return;locked=true;const correct=t===chosen;let mark=document.createElement('div');mark.className='feedback '+(correct?'good':'bad');mark.textContent=correct?'⭕':'❌';b.append(mark);sound(correct?'correct':'wrong');if(correct){b.disabled=true;left--;update();timer(()=>{if(r!==round)return;b.classList.add('vanish');timer(()=>{if(r!==round)return;b.remove();if(left===0){show('complete');sound('finish')}},300)},750)}else{timer(()=>{if(r!==round)return;mark.remove();locked=false},800)}}})}
$('enter').onclick=()=>show('settings');$('begin').onclick=start;$('restart').onclick=start;$('repeat').onclick=start;$('back').onclick=()=>{stop();show('settings')};$('home').onclick=()=>{stop();show('intro')};
$('mutebtn').onclick=()=>{muted=!muted;$('mutebtn').textContent=muted?'おと：オフ':'おと：オン'};

window.addEventListener('pagehide',stop);
})();
</script></body></html>
